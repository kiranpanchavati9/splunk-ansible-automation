---
- name: Check the status of the Heavy Forwarder
  ansible.builtin.command:
    cmd: >
      {{ splunk_home }}/bin/splunk status
  register: status
  changed_when: false
  failed_when: false

- name: Print Heavy Forwarder status
  ansible.builtin.debug:
    var: status.stdout_lines

- name: Connect Heavy Forwarder to Deployment Server
  ansible.builtin.command:
    cmd: >
      {{ splunk_home }}/bin/splunk set deploy-poll
      {{ deployment_server_uri }}
      -auth {{ splunk_admin_user }}:{{ splunk_admin_password }}
  register: deploy_server
  changed_when: false
  failed_when: false

- name: Print Deployment Server result
  ansible.builtin.debug:
    var: deploy_server.stdout_lines

- name: Restart Heavy Forwarder
  ansible.builtin.command:
    cmd: "{{ splunk_home }}/bin/splunk restart"
  register: restart


- name: Connect Indexer to License Manager
  ansible.builtin.command:
    argv:
      - /opt/splunk/bin/splunk
      - edit
      - licenser-localpeer
      - -manager_uri
      - "https://{{ license_manager }}:8089"
      - -auth
      - "admin:{{ splunk_admin_password }}"
  become: true
  become_user: splunk
  no_log: true
  when: use_remote_license_manager | default(false)
  notify: Restart Splunk