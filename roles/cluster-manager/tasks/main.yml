---
- name: Configure Cluster Manager
  ansible.builtin.command:
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - edit
      - cluster-config
      - -mode
      - manager
      - -replication_factor
      - "{{ replication_factor | string }}"
      - -search_factor
      - "{{ search_factor | string }}"
      - -secret
      - "{{ cluster_secret }}"
      - -cluster_label
      - "{{ cluster_label }}"
      - -auth
      - "{{ splunk_admin_user }}:{{ splunk_admin_password }}"
  become: true
  become_user: splunk
  no_log: true
  notify: Restart Splunk

- name: Create custom index app directory
  ansible.builtin.file:
    path: "{{ splunk_home }}/etc/manager-apps/ta_index_custom_app/local"
    state: directory
    owner: splunk
    group: splunk
    mode: "0755"
  become: true

- name: Create indexes.conf
  ansible.builtin.copy:
    dest: "{{ splunk_home }}/etc/manager-apps/ta_index_custom_app/local/indexes.conf"
    owner: splunk
    group: splunk
    mode: "0644"
    content: |
      [infra_linux_custom_index]
      homePath = $SPLUNK_DB/infra_linux_custom_index/db
      coldPath = $SPLUNK_DB/infra_linux_custom_index/colddb
      thawedPath = $SPLUNK_DB/infra_linux_custom_index/thaweddb
      maxTotalDataSizeMB = 500000
      frozenTimePeriodInSecs = 7776000
  become: true
  notify: Apply Indexer Cluster Bundle

- name: Run notified handlers now
  ansible.builtin.meta: flush_handlers

- name: Check Splunk status
  ansible.builtin.command:
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - status
  become: true
  become_user: splunk
  register: splunk_status
  retries: 30
  delay: 10
  until:
    - splunk_status.rc == 0
    - "'splunkd is running' in splunk_status.stdout"
  changed_when: false

- name: Display Splunk status
  ansible.builtin.debug:
    var: splunk_status.stdout_lines