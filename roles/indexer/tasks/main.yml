- name: Configure Indexer as Cluster Peer
  hosts: indexers
  serial: 1          # <-- restart one peer at a time, not all at once
  tasks:
    - name: Configure Indexer as Cluster Peer
      command: >
        {{ splunk_home }}/bin/splunk
        edit cluster-config
        -mode peer
        -manager_uri {{ cluster_manager_uri }}
        -replication_port 9887
        -secret {{ cluster_secret }}
        -cluster_label {{ cluster_label }}
        -auth {{ splunk_admin_user }}:{{ splunk_admin_password }}

    - name: Restart Splunk
      command: "{{ splunk_home }}/bin/splunk restart"

    - name: Wait for Splunk to start
      wait_for:
        port: 8089
        timeout: 180

    - name: Wait for peer to rejoin cluster and clear detention
      pause:
        seconds: 30   # gives fixup a moment to run before moving to next peer